<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanShare</title>
  
  <!-- Inter Font for crisp modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decor"></div>
  <main>
    <header class="app-header">
      <div >
        <img src="icon-192.png" alt="CleanShare" width="32" height="32">
      </div>
      <h1>CleanShare</h1>
    </header>
    
    <div class="card">
      <div class="field-group">
        <label for="input">Link to clean</label>
        <textarea id="input" placeholder="Paste link here..."></textarea>
      </div>

      <div class="buttons">
        <button id="clean" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m4.93 10.93 2.83 2.83"/><path d="M2 18h4"/><path d="M20 18h2"/><path d="m19.07 10.93-2.83 2.83"/><path d="M22 22 2 2"/></svg>
          Clean Link
        </button>
        <button id="copy" class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy
        </button>
      </div>

      <div class="field-group">
        <label for="output">Cleaned result</label>
        <textarea id="output" readonly placeholder="Your clean link will appear here..."></textarea>
      </div>

      <p id="status" class="status"></p>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/cleanshare/sw.js');
    }
  </script>
  <script src="clean.js"></script>
</body>
</html>
